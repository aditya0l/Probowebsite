<section id="proof" class="sec">
  <div class="wrap">
    <span class="eyebrow">Proof</span>
    <h2 class="display" style="margin-top:14px">18,000+ gyms, across India.</h2>
    <p class="sub">One showroom in Jaipur and three regional sales desks. Tap a region to see who to call.</p>
  </div>
  <div class="map-wrap" id="mapWrap">
    <canvas id="map" aria-label="Map of India with a pillar for each city with Probodyline installs"></canvas>
    <div class="city-card" id="cityCard" aria-live="polite"></div>
    <ol class="city-list" id="cityList"></ol>
  </div>
  <div class="wrap ba-head" id="ba-sec">
    <h3 class="display">From empty shell to opening day.</h3>
    <p class="sub">Drag across the image.</p>
    <div class="ba" id="ba">
      <img id="baAfter" alt="A finished commercial gym floor fitted with Probodyline equipment">
      <div class="ba-before" id="baBeforeWrap"><img id="baBefore" alt="The same space before installation, an empty concrete shell"></div>
      <span class="ba-tag" style="left:16px">Before</span><span class="ba-tag" style="right:16px">After</span>
      <div class="ba-handle" id="baHandle"><i class="ph ph-arrows-left-right"></i></div>
      <input type="range" min="0" max="100" value="50" id="baRange" aria-label="Compare before and after">
    </div>
    <p class="note">Illustration of a typical commercial fit-out.</p>
  </div>
</section>
