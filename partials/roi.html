<section id="roi" class="sec">
  <div class="wrap">
    <h2 class="display">When does it pay back?</h2>
    <p class="sub">Enter your budget, fee and costs. Members and running costs start from the gym you planned.</p>
    <div class="roi">
      <div class="roi-ctrl">
        <div class="field"><label for="roiInv">Your equipment budget <b id="roiInvV"></b></label><input type="range" id="roiInv" min="200000" max="20000000" step="50000" value="3000000"></div>
        <div class="field"><label for="roiFee">Monthly membership fee <b id="roiFeeV"></b></label><input type="range" id="roiFee" min="500" max="6000" step="100" value="1800"></div>
        <div class="field"><label for="roiMem">Active members <b id="roiMemV"></b></label><input type="range" id="roiMem" min="20" max="1500" step="10" value="220"></div>
        <div class="field"><label for="roiCost">Monthly running costs (rent, staff, power) <b id="roiCostV"></b></label><input type="range" id="roiCost" min="20000" max="2000000" step="10000" value="220000"></div>
        <button class="chip" id="roiSync" style="justify-self:start"><i class="ph ph-arrows-clockwise"></i>Match my planned gym</button>
      </div>
      <div class="roi-out">
        <div class="roi-kpi"><div><b id="roiPay">-</b>Payback</div><div><b id="roiProfit">-</b>Profit a month</div><div><b id="roiY3">-</b>Cash after 3 years</div></div>
        <svg id="roiChart" viewBox="0 0 800 300" role="img" aria-label="Cumulative cash over 36 months"></svg>
        <p class="note">An estimate for comparing scenarios, not financial advice.</p>
      </div>
    </div>
  </div>
</section>
