<section id="muscles" class="sec" style="padding-top:40px">
  <div class="wrap">
    <h2 class="display">Pick a muscle. Get the machine.</h2>
    <p class="sub">Tap the body or a muscle group. We show every machine on this site that trains it.</p>
    <div class="mus">
      <div class="mus-stage"><canvas id="body" aria-label="3D body. Tap a muscle group to see the machines that train it."></canvas><p class="stage-hint">Drag to turn. Tap a muscle.</p></div>
      <div class="mus-side">
        <div class="rail" id="musChips" style="flex-wrap:wrap"></div>
        <h3 class="display" id="musTitle">Chest</h3>
        <p class="muted" id="musDesc"></p>
        <div class="mus-list" id="musList"></div>
      </div>
    </div>
  </div>
</section>
